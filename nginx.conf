server {
    listen 7000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ==============================================
    # SECURITY HEADERS
    # ==============================================

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.genjutsu999.site wss://api.genjutsu999.site; worker-src 'self' blob:;" always;

    # ==============================================
    # REACT ROUTER / SPA
    # ==============================================

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==============================================
    # HTML CACHE
    # ==============================================

    location = /index.html {
        expires -1;
    }

    # ==============================================
    # VITE STATIC ASSETS
    # ==============================================

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        access_log off;
    }

    # ==============================================
    # HEALTH CHECK
    # ==============================================

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # ==============================================
    # BLOCK HIDDEN FILES
    # ==============================================

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==============================================
    # GZIP COMPRESSION
    # ==============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;

    gzip_min_length 256;
    gzip_comp_level 5;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;
}